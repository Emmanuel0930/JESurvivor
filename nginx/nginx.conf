# ══════════════════════════════════════════════════════════════════
# Nginx — API Gateway de JESurvivor (Entregable 2)
# Patrón Estrangulador: enruta tráfico entre Django y Flask
#
# Rutas:
#   /api/v2/reservas/*  → Flask :5000  (microservicio estrangulado)
#   /api/schema/        → Django :8000 (documentación OpenAPI)
#   /api/docs/          → Django :8000 (Swagger UI)
#   /api/*              → Django :8000 (monolito legacy)
#   /*                  → Django :8000 (frontend SPA)
# ══════════════════════════════════════════════════════════════════

upstream django_web {
    server django:8000;
}

upstream flask_reservas {
    server flask_reservas:5000;
}

server {
    listen 80;
    server_name _;

    # Tamaño máximo de body (para uploads futuros)
    client_max_body_size 10M;

    # ──────────────────────────────────────────────────────────────
    # Microservicio Flask — Rutas estranguladas (API v2)
    # Todo lo de /api/v2/reservas/ va al microservicio Flask
    # ──────────────────────────────────────────────────────────────
    location /api/v2/reservas/ {
        proxy_pass         http://flask_reservas;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # CORS headers para el microservicio
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-User-Id" always;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;

        # Preflight OPTIONS
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ──────────────────────────────────────────────────────────────
    # Monolito Django — Rutas API v1 y frontend
    # ──────────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://django_web;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept-Language, X-User-Id" always;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ──────────────────────────────────────────────────────────────
    # Health check de Nginx
    # ──────────────────────────────────────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx"}';
        add_header Content-Type application/json;
    }
}
