<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JESurvivor — Plataforma de supervivencia: foro, tienda de kits, cursos y suscripciones premium." />
    <title>JESurvivor</title>

    <!-- Favicon emoji -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☠</text></svg>" />

    <!-- Estilos principales -->
    <link rel="stylesheet" href="styles.css" />

    <!--
      API BASE RESOLUTION
      ─────────────────────────────────────────────────────────
      Lógica corregida para funcionar tanto detrás de Nginx
      (producción/Docker en puerto 80) como en desarrollo local.

      ANTES (bug): si el puerto no era 8000, asumía dev estático
      y apuntaba a 127.0.0.1:8000 — roto al servir desde Nginx en :80
      porque el puerto 8000 no está expuesto al host.

      AHORA: solo redirige a :8000 si el puerto es uno de los típicos
      de dev estático (5173 Vite, 5500 LiveServer, 3000, 4200, etc.).
      En cualquier otro caso (incluyendo :80 via Nginx) usa /api relativo.
      ─────────────────────────────────────────────────────────
    -->
    <script>
      (function () {
        try {
          var DEV_STATIC_PORTS = ["5173", "5500", "5501", "3000", "4200", "8080"];
          var port = location.port || "";
          var isLocal =
            location.hostname === "127.0.0.1" ||
            location.hostname === "localhost" ||
            location.hostname === "::1";

          if (isLocal && DEV_STATIC_PORTS.indexOf(port) !== -1) {
            // Desarrollo local con servidor estático (Vite, LiveServer, etc.)
            // → apuntar directamente al backend Django
            window.__API_BASE__ = "http://127.0.0.1:8000/api";
          }
          // En todos los demás casos (Nginx en :80, acceso por IP, AWS, etc.)
          // api.js usa "/api" por defecto → pasa por Nginx correctamente
        } catch (e) {
          // noop — cualquier error no rompe la app
        }
      })();
    </script>
  </head>

  <body>
    <!-- Navbar (inyectado por navbar.js) -->
    <header id="navbar" role="banner" aria-label="Navegación principal">
    </header>

    <!-- Contenedor principal de la app (SPA) -->
    <main id="app-root" role="main" aria-live="polite">
      <div class="loader-wrap">
        <div class="loader-ring"></div>
        <p class="loader-label">Iniciando JESurvivor...</p>
      </div>
    </main>

    <script type="module" src="app.js?v=2"></script>
  </body>
</html>
